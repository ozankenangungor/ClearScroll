<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Three lines of "text": the middle one is blurred. -->
  <rect x="26" y="34" width="76" height="12" rx="6" fill="#ffffff"/>
  <rect x="26" y="58" width="76" height="12" rx="6" fill="#bfdbfe" filter="url(#soft)"/>
  <rect x="26" y="82" width="52" height="12" rx="6" fill="#ffffff"/>
</svg>
