[target.wasm32-unknown-unknown]
# simd128: WebAssembly SIMD (Chrome 91+); measured 95 → 32 ms/text CPU inference,
# see docs/benchmarks. getrandom needs its wasm_js backend selected explicitly.
rustflags = ["-C", "target-feature=+simd128", "--cfg=web_sys_unstable_apis", "--cfg=getrandom_backend=\"wasm_js\""]
