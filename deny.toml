# cargo-deny: dependency licence and advisory policy.
#   cargo deny --target wasm32-unknown-unknown check
[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# RustSec advisories are errors; unmaintained crates are reported for review.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences compatible with redistributing the compiled engine.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
