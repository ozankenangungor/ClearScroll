# Shipped browser engine: exact default features, wasm32 target, no advisory suppressions.
# Broad all-feature/native audit remains recorded separately in release evidence.
[graph]
targets = ["wasm32-unknown-unknown"]
all-features = false

[advisories]
# RustSec advisories are errors; unmaintained crates are reported for review.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences compatible with redistributing the compiled engine.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
